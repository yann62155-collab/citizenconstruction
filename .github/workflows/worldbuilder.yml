name: Build CitizenWorldBuilder
on:
  push:
    branches: [ citizen-world-builder ]
    paths: [ 'CitizenWorldBuilder/**', '.github/workflows/worldbuilder.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod
        working-directory: CitizenWorldBuilder
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: citizenworldbuilder-jar
          path: CitizenWorldBuilder/build/libs/*.jar
