plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = neo_version }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version:minecraft_version, minecraft_version_range:minecraft_version_range, neo_version:neo_version, loader_version_range:loader_version_range, mod_id:mod_id, mod_name:mod_name, mod_license:mod_license, mod_version:mod_version]
    inputs.properties replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    expand replaceProperties
}
sourceSets.main.resources.srcDir generateModMetadata
